# The host tests on every push and pull request (no toolchain: the simulator core, the debounce, the knobs, the LEDs).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow
      - run: tests/run_tests.sh
